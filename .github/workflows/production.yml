name: Deploy Frontend to ECS (Production)

on:
    push:
        branches: [production]

jobs:
    deploy:
        name: Deploy Frontend to ECS (Production)
        runs-on: ubuntu-latest
        environment: production

        permissions:
            contents: read

        env:
            AWS_REGION: us-east-1
            ECR_REPOSITORY: prod-frontend
            ECS_CLUSTER: cask-exchange-prod-cluster
            ECS_SERVICE: cask-exchange-prod-frontend

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v4
              with:
                  aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
                  aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                  aws-region: ${{ env.AWS_REGION }}

            - name: Login to Amazon ECR
              id: login-ecr
              uses: aws-actions/amazon-ecr-login@v2

            - name: Build and push image
              env:
                  ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
                  IMAGE_TAG: ${{ github.sha }}
                  NEXT_PUBLIC_APP_NAME: ${{ secrets.NEXT_PUBLIC_APP_NAME }}
                  NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
                  NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
                  NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL }}
                  NEXT_PUBLIC_STRIPE_PUBLIC_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLIC_KEY }}
                  STRIPE_CONNECT_ACCOUNT_ID: ${{ secrets.STRIPE_CONNECT_ACCOUNT_ID }}
              run: |
                  docker buildx create --use --name prod-builder
                  docker buildx build --platform linux/amd64 \
                    --build-arg NEXT_PUBLIC_APP_NAME=${NEXT_PUBLIC_APP_NAME} \
                    --build-arg NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL} \
                    --build-arg NEXTAUTH_SECRET=${NEXTAUTH_SECRET} \
                    --build-arg NEXTAUTH_URL=${NEXTAUTH_URL} \
                    --build-arg NEXT_PUBLIC_STRIPE_PUBLIC_KEY=${NEXT_PUBLIC_STRIPE_PUBLIC_KEY} \
                    --build-arg STRIPE_CONNECT_ACCOUNT_ID=${STRIPE_CONNECT_ACCOUNT_ID} \
                    -t ${ECR_REGISTRY}/${ECR_REPOSITORY}:prod-latest \
                    -t ${ECR_REGISTRY}/${ECR_REPOSITORY}:prod-${IMAGE_TAG} \
                    --push .

            - name: Force new ECS deployment
              run: |
                  aws ecs update-service \
                    --cluster ${ECS_CLUSTER} \
                    --service ${ECS_SERVICE} \
                    --force-new-deployment \
                    --region ${AWS_REGION}
